<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SOC Sentinel | {{ title }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                🛡️
                <span>SOC Sentinel</span>
            </div>

            <nav>

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('alerts') }}">
                    Alerts
                </a>

                <a href="{{ url_for('incidents') }}">
                    Incidents
                </a>

                <a href="{{ url_for('logs') }}">
                    Log Explorer
                </a>

                <a href="{{ url_for('detection_rules') }}">
                    Detection Rules
                </a>

                <a href="{{ url_for('mitre') }}">
                    MITRE ATT&CK
                </a>

                <a href="{{ url_for('reports') }}">
                    Reports
                </a>

                <a href="{{ url_for('settings') }}">
                    Settings
                </a>

            </nav>

            <a href="{{ url_for('auth.logout') }}"
               class="logout">
                Logout
            </a>

        </aside>


        <main class="main-content">

            <header class="topbar">

                <div>
                    <h1>{{ title }}</h1>
                    <p>SOC Sentinel</p>
                </div>

                <div class="user-info">
                    👤 {{ current_user.username }}
                </div>

            </header>


            <section class="panel">

                <div class="panel-header">
                    <h2>{{ title }}</h2>
                </div>

                <div class="coming-soon">

                    <div class="coming-icon">
                        🛠️
                    </div>

                    <h2>Module Coming Soon</h2>

                    <p>
                        {{ description }}
                    </p>

                    <a href="{{ url_for('dashboard') }}"
                       class="back-button">
                        ← Back to Dashboard
                    </a>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
